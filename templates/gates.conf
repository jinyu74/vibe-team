# 템플릿: <프로젝트>/.vibe/gates.conf — 그린 루프 게이트 (공통 §6.2). 테스트설계 파트가 만들고 커밋한다.
# 형식: 이름 | 담당 파트 | 명령      (이름은 영문·숫자·._- · 명령은 프로젝트 루트에서 bash -c 로 실행, 실패 = 비0 종료)
# 실행: team-gate --label <작업ID>   목록: team-gate --list   일부: team-gate --only unit,lint
# 아래 명령은 예시다 — 프로젝트 스택에 맞게 바꾼다. CI 는 같은 게이트를 실행한다 (CI 파트).

unit     | 테스트설계 | npm test -- --coverage
lint     | 품질       | npm run lint && npm run typecheck
e2e      | 테스트설계 | npx playwright test
perf     | 성능       | node scripts/perf-budget.js
security | 보안       | npm audit --audit-level=high

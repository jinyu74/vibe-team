# 템플릿: <프로젝트>/.vibe/gates.conf — 그린 루프 게이트 (공통 §6.2). 테스트설계 파트가 만들고 커밋한다.
# 형식: 이름 | 담당 파트 [scope=all|task|release] [timeout=<초>] | 명령
#   이름은 영문·숫자·._- · 명령은 프로젝트 루트에서 bash -o pipefail -c 로 실행, 실패 = 비0 종료 · 환경 변수 VIBE_SCOPE·VIBE_LABEL
#   scope: all(기본) = 작업·릴리스 모두 / task = 작업 판정만 / release = 제품 전체 판정만 (§6.3)
#   timeout: 초 단위, 없으면 VIBE_GATE_TIMEOUT(기본 1800). 초과 = TIMEOUT 실패
# 실행: 작업 team-gate --scope task --label <작업ID> · 릴리스 후보 team-gate --label <버전> · 목록 team-gate --list
# 범위마다 테스트설계·품질·성능·보안 게이트 각각 최소 1개 필수. CI 는 같은 게이트를 실행한다 (CI 파트).
# FULL_PASS 만으로 배포하지 않는다 — team-release-check 가 SHA·아티팩트·합의 서명·결함 0건·승인을 함께 검사한다 (§7.1).
# 아래 명령은 예시다 — 프로젝트 스택에 맞게 바꾼다.

unit        | 테스트설계                            | npm test -- --coverage
regression  | 테스트설계                            | npx playwright test --grep @done
accept-task | 테스트설계 scope=task                 | npx playwright test --grep "@$VIBE_LABEL"
accept-all  | 테스트설계 scope=release timeout=3600 | npx playwright test
lint        | 품질                                  | npm run lint && npm run typecheck
perf        | 성능 timeout=900                      | node scripts/perf-budget.js
security    | 보안                                  | npm audit --audit-level=high

# 이 프로젝트 유형에서의 책임 (정체 블록에 주입, 역할 파일보다 우선)
@duty 시스템설계-클로드 발견 단계에서는 ADR·계약 대신 컨셉별 구현 규모·난이도·필요 파트 추정(estimate.md)과 팀 구성안의 기술 근거를 맡는다.
@duty 시스템설계-코덱스 규모 추정의 과소 평가·숨은 비용(운영·규정·콘텐츠 제작량)을 반증한다.
@duty 진행-클로드 팀 구성안(teams/<프로젝트>.conf 초안)은 시스템설계 페어와 함께 만들고, 사용자 결정 후에만 파일을 만든다.

